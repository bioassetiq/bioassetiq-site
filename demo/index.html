<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>BioAssetIQ — internal review</title>
<style>
:root {
  --gold:  #c8a45a;
  --gold2: #e1c77c;
  --bg:    #050914;
  --bg2:   #0e1a2d;
  --line:  rgba(211,178,103,.22);
  --text:  #f4f7f8;
  --muted: #b0bdcc;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI",
               Roboto, Arial, sans-serif;
  display: grid;
  place-items: center;
}
body:before {
  content: "";
  position: fixed; inset: 0;
  background:
    radial-gradient(circle at 80% 4%, rgba(200,164,90,.18), transparent 32%),
    radial-gradient(circle at 12% 38%, rgba(67,97,140,.14), transparent 34%);
  z-index: -1;
}
.box {
  background: linear-gradient(180deg, rgba(19,34,58,.94), rgba(8,17,31,.95));
  border: 1px solid var(--line);
  border-radius: 24px;
  box-shadow: 0 34px 110px rgba(0,0,0,.42);
  padding: 36px 32px;
  max-width: 420px;
  width: calc(100% - 36px);
  text-align: center;
}
.eyebrow {
  color: var(--gold2);
  text-transform: uppercase;
  letter-spacing: .18em;
  font-size: 11px;
  font-weight: 850;
  margin-bottom: 14px;
}
h1 {
  font-family: Georgia, "Times New Roman", serif;
  font-weight: 400;
  font-size: 32px;
  margin: 0 0 6px;
  line-height: 1.05;
}
.muted { color: var(--muted); font-size: 13.5px; margin: 0 0 22px; }
.muted2 { color: rgba(176,189,204,.7); font-size: 12px; margin: 14px 0 0; }
form { display: grid; gap: 12px; }
input[type="password"] {
  background: rgba(255,255,255,.05);
  color: var(--text);
  font-family: inherit;
  font-size: 16px;
  border: 1px solid rgba(200,164,90,.30);
  border-radius: 999px;
  padding: 12px 16px;
  text-align: center;
  outline: none;
  transition: border-color .15s, background .15s;
}
input[type="password"]:focus {
  border-color: var(--gold2);
  background: rgba(200,164,90,.05);
}
button {
  background: var(--gold);
  color: #07101d;
  font-family: inherit;
  font-weight: 850;
  font-size: 14px;
  border: 0;
  border-radius: 999px;
  padding: 12px 16px;
  cursor: pointer;
}
button:hover { background: var(--gold2); }
.err {
  color: #d78383;
  font-size: 13px;
  height: 18px;
}
</style>
</head>
<body>
<div class="box">
  <div class="eyebrow">BioAssetIQ · internal review</div>
  <h1>Demo access</h1>
  <p class="muted">Enter the access password to view the agency prototype.</p>
  <form id="f">
    <input id="pw" type="password" autofocus autocomplete="off" placeholder="Password" />
    <button type="submit">Unlock</button>
    <div class="err" id="err"></div>
  </form>
  <p class="muted2">Internal review only · placeholder data · not for public launch.</p>
</div>

const ITERATIONS = 250000;
const SS_KEY     = "bioassetiq-internal-demo-html";

function b64dec(s) {
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

async function deriveKey(password) {
  const enc = new TextEncoder();
  const km = await crypto.subtle.importKey(
    "raw", enc.encode(password),
    { name: "PBKDF2" }, false, ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: b64dec(SALT), iterations: ITERATIONS, hash: "SHA-256" },
    km,
    { name: "AES-GCM", length: 256 },
    false,
    ["decrypt"]
  );
}

async function decrypt(password) {
  const key = await deriveKey(password);
  const pt  = await crypto.subtle.decrypt(
    { name: "AES-GCM", iv: b64dec(IV) },
    key,
    b64dec(CIPHERTEXT)
  );
  return new TextDecoder().decode(pt);
}

function render(html) {
  document.open();
  document.write(html);
  document.close();
}

// auto-restore from sessionStorage if already unlocked this session
const cached = sessionStorage.getItem(SS_KEY);
if (cached) render(cached);

document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const pw  = document.getElementById("pw").value;
  const err = document.getElementById("err");
  err.textContent = "Unlocking…";
  try {
    const html = await decrypt(pw);
    sessionStorage.setItem(SS_KEY, html);
    render(html);
  } catch (e) {
    err.textContent = "Wrong password";
    document.getElementById("pw").select();
  }
});
